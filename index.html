<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Management System | Balanced Colors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Balanced Pleasant Colors */
        body {
            background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 50%, #81ECEC 100%);
            min-height: 100vh;
        }

        /* Navbar - Deep Purple */
        .navbar {
            background: linear-gradient(135deg, #5F27CD 0%, #341f97 100%);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #FFEAA7;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .logo i {
            color: #FFEAA7;
            margin-right: 10px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links button {
            padding: 10px 20px;
            border: none;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            color: #FFFFFF;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }

        .nav-links button:hover {
            background: #FFEAA7;
            color: #5F27CD;
            transform: scale(1.05);
        }

        .nav-links button.active {
            background: #FFEAA7;
            color: #5F27CD;
            border: 1px solid #FFFFFF;
        }

        /* Container */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Cards */
        .card {
            background: #FFFFFF;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #DFE6E9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #5F27CD;
            border-bottom: 3px solid #00CEC9;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #5F27CD 0%, #00CEC9 100%);
            color: #FFFFFF;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #DFE6E9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
            color: #FFEAA7;
        }

        /* Search Form */
        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .search-form input, .search-form button {
            padding: 12px;
            border: 2px solid #00CEC9;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-form input {
            background: #FFFFFF;
        }

        .search-form button {
            background: #5F27CD;
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .search-form button:hover {
            background: #00CEC9;
            transform: scale(1.02);
        }

        /* Buses Grid */
        .buses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .bus-card {
            background: #FFFFFF;
            border-radius: 15px;
            padding: 20px;
            border-left: 6px solid #00CEC9;
            border-bottom: 2px solid #DFE6E9;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .bus-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bus-name {
            font-size: 20px;
            font-weight: bold;
            color: #5F27CD;
        }

        .bus-fare {
            font-size: 24px;
            font-weight: bold;
            color: #00CEC9;
        }

        .bus-details {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            padding: 12px 0;
            border-top: 1px solid #DFE6E9;
            border-bottom: 1px solid #DFE6E9;
            color: #2C3E50;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: #5F27CD;
            color: #FFFFFF;
            width: 100%;
        }

        .btn-primary:hover {
            background: #00CEC9;
            transform: scale(1.02);
        }

        .btn-danger {
            background: #FF7675;
            color: #FFFFFF;
        }

        .btn-success {
            background: #00B894;
            color: #FFFFFF;
        }

        /* Seat Layout */
        .seat-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .seat {
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .seat.available {
            background: #00B894;
            color: #FFFFFF;
        }

        .seat.available:hover {
            background: #55EFC4;
            transform: scale(1.05);
        }

        .seat.booked {
            background: #FF7675;
            color: #FFFFFF;
            cursor: not-allowed;
        }

        .seat.selected {
            background: #FDCB6E;
            color: #2C3E50;
            border: 2px solid #5F27CD;
            transform: scale(1.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #FFFFFF;
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #00CEC9;
        }

        .modal-content h2, .modal-content h3 {
            color: #5F27CD;
        }

        /* Ticket */
        .ticket {
            background: #FFF5E6;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px dashed #00CEC9;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #5F27CD;
        }

        input {
            padding: 10px;
            border: 1px solid #00CEC9;
            border-radius: 8px;
            width: 100%;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 8px 18px;
            border-radius: 20px;
            background: #FFFFFF;
            border: 1px solid #00CEC9;
            cursor: pointer;
            font-weight: bold;
            color: #5F27CD;
            transition: 0.3s;
        }

        .filter-chip.active, .filter-chip:hover {
            background: #5F27CD;
            color: #FFFFFF;
            border-color: #00CEC9;
        }

        /* Table for Buses List */
        .bus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .bus-table th, .bus-table td {
            border: 1px solid #00CEC9;
            padding: 12px;
            text-align: left;
        }

        .bus-table th {
            background: #5F27CD;
            color: #FFFFFF;
        }

        .bus-table tr:nth-child(even) {
            background: #F0F3F4;
        }

        .bus-table tr:hover {
            background: #DFE6E9;
        }

        /* Info Section for Home Page */
        .info-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-box {
            background: linear-gradient(135deg, #5F27CD10, #00CEC910);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #00CEC9;
        }

        .info-box i {
            font-size: 40px;
            color: #5F27CD;
            margin-bottom: 15px;
        }

        .info-box h3 {
            color: #5F27CD;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #636E72;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        🚌 Bus Management System
    </div>
    <div class="nav-links">
        <button onclick="showPage('home')" id="btn-home" class="active">🏠 Home</button>
        <button onclick="showPage('buseslist')" id="btn-buseslist">📜 Buses List</button>
        <button onclick="showPage('bookings')" id="btn-bookings">🎫 Bookings</button>
        <button onclick="showPage('admin')" id="btn-admin">👑 Admin</button>
        <button onclick="showPage('profile')" id="btn-profile">👤 Profile</button>
    </div>
</div>

<div class="container" id="mainContent"></div>

<script>
    // ==================== BUS DATA ====================
    let buses = [
        { id: 1, name: "Royal Express", type: "Luxury", from: "New York", to: "Boston", time: "06:00 AM", duration: "4h 30m", fare: 85, seats: 40, bookedSeats: [2,5,7,10,12,15], amenities: "AC, WiFi, Snacks", rating: "★★★★★" },
        { id: 2, name: "Golden Chariot", type: "Premium", from: "New York", to: "Boston", time: "09:30 AM", duration: "4h 15m", fare: 95, seats: 36, bookedSeats: [1,3,8,11,14], amenities: "AC, WiFi, Meal", rating: "★★★★★" },
        { id: 3, name: "Midnight Express", type: "Economy", from: "New York", to: "Boston", time: "11:00 PM", duration: "4h 45m", fare: 65, seats: 44, bookedSeats: [20,21,22,23,24], amenities: "AC, Charging", rating: "★★★★☆" },
        { id: 4, name: "Maharaja Express", type: "Luxury", from: "New York", to: "Washington", time: "08:00 AM", duration: "5h 30m", fare: 125, seats: 32, bookedSeats: [4,9,13], amenities: "AC, WiFi, Meal, TV", rating: "★★★★★" },
        { id: 5, name: "Sleeper King", type: "Sleeper", from: "Boston", to: "Washington", time: "10:00 PM", duration: "7h 00m", fare: 110, seats: 28, bookedSeats: [1,2,3], amenities: "AC, Bed, Charging", rating: "★★★★☆" },
        { id: 6, name: "Palace on Wheels", type: "Luxury", from: "New York", to: "Philadelphia", time: "07:00 AM", duration: "3h 00m", fare: 75, seats: 38, bookedSeats: [5,6,7], amenities: "AC, WiFi, Snacks", rating: "★★★★★" },
        { id: 7, name: "Deccan Queen", type: "Express", from: "Boston", to: "Philadelphia", time: "02:00 PM", duration: "5h 00m", fare: 70, seats: 42, bookedSeats: [10,11,12], amenities: "AC, Charging", rating: "★★★★☆" }
    ];

    let bookings = JSON.parse(localStorage.getItem('balanced_bookings')) || [];
    let currentUser = JSON.parse(localStorage.getItem('balanced_user')) || { name: "Guest User", email: "guest@example.com", phone: "9876543210" };
    let selectedBus = null;
    let selectedSeats = [];
    let currentFilter = "all";

    // ==================== SHOW PAGE FUNCTION ====================
    function showPage(page) {
        document.querySelectorAll('.nav-links button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${page}`).classList.add('active');
        
        if(page === 'home') {
            showHome();
        } else if(page === 'buseslist') {
            showBusesList();
        } else if(page === 'bookings') {
            showBookings();
        } else if(page === 'admin') {
            showAdmin();
        } else if(page === 'profile') {
            showProfile();
        }
    }

    // ==================== HOME PAGE (WITH ADDITIONAL INFO) ====================
    function showHome() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div>🚌 Total Buses</div><div class="stat-number">${buses.length}</div></div>
                <div class="stat-card"><div>🎫 Total Bookings</div><div class="stat-number">${bookings.length}</div></div>
                <div class="stat-card"><div>💰 Total Revenue</div><div class="stat-number">$${bookings.reduce((sum, b) => sum + b.total, 0)}</div></div>
                <div class="stat-card"><div>⭐ Customer Rating</div><div class="stat-number">4.8/5</div></div>
            </div>

            <!-- Additional Information Section - ONLY ON HOME PAGE -->
            <div class="card">
                <h2>📢 Welcome to Our Bus Service</h2>
                <div class="info-section">
                    <div class="info-box">
                        <i>🚌</i>
                        <h3>24/7 Service</h3>
                        <p>We operate buses 24 hours a day, 7 days a week. Early morning to late night departures available.</p>
                    </div>
                    <div class="info-box">
                        <i>💺</i>
                        <h3>Comfortable Seats</h3>
                        <p>Premium cushioned seats with ample legroom. Recliner options available on luxury buses.</p>
                    </div>
                    <div class="info-box">
                        <i>📶</i>
                        <h3>Free WiFi</h3>
                        <p>Stay connected during your journey with complimentary high-speed WiFi on all buses.</p>
                    </div>
                    <div class="info-box">
                        <i>🍴</i>
                        <h3>Free Snacks</h3>
                        <p>Complimentary snacks and beverages served on all premium and luxury bus services.</p>
                    </div>
                    <div class="info-box">
                        <i>🔒</i>
                        <h3>Safe Travel</h3>
                        <p>GPS tracked buses, professional drivers, and 24/7 customer support for your safety.</p>
                    </div>
                    <div class="info-box">
                        <i>💰</i>
                        <h3>Best Prices</h3>
                        <p>Competitive fares with special discounts for students, seniors, and group bookings.</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🔍 Search Buses</h2>
                <div class="search-form">
                    <input type="text" id="fromCity" placeholder="From City" value="New York">
                    <input type="text" id="toCity" placeholder="To City" value="Boston">
                    <input type="date" id="travelDate">
                    <button onclick="searchBuses()">Search Buses</button>
                </div>
            </div>

            <div class="card">
                <h2>🚍 Available Buses</h2>
                <div id="busesList" class="buses-grid"></div>
            </div>
        `;
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('travelDate').value = today;
        searchBuses();
    }

    function searchBuses() {
        const from = document.getElementById('fromCity').value.toLowerCase();
        const to = document.getElementById('toCity').value.toLowerCase();
        
        const filtered = buses.filter(bus => 
            bus.from.toLowerCase() === from && 
            bus.to.toLowerCase() === to
        );
        
        const busesDiv = document.getElementById('busesList');
        
        if(filtered.length === 0) {
            busesDiv.innerHTML = '<p style="text-align:center; padding:40px;">No buses found for this route.</p>';
            return;
        }
        
        busesDiv.innerHTML = filtered.map(bus => `
            <div class="bus-card">
                <div class="bus-header">
                    <span class="bus-name">🚌 ${bus.name}</span>
                    <span class="bus-fare">$${bus.fare}</span>
                </div>
                <div class="bus-details">
                    <span>⏰ ${bus.time}</span>
                    <span>⏱️ ${bus.duration}</span>
                    <span>💺 ${bus.seats - bus.bookedSeats.length} left</span>
                    <span>${bus.rating}</span>
                </div>
                <div style="margin-bottom:10px; font-size:12px;">${bus.amenities}</div>
                <button class="btn btn-primary" onclick="openBookingModal(${bus.id})">Book Now</button>
            </div>
        `).join('');
    }

    // ==================== BUSES LIST PAGE ====================
    function showBusesList() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <div class="card">
                <h2>📜 Complete Bus Fleet Directory</h2>
                <div class="filter-bar">
                    <div class="filter-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All Buses</div>
                    <div class="filter-chip ${currentFilter === 'luxury' ? 'active' : ''}" onclick="setFilter('luxury')">Luxury</div>
                    <div class="filter-chip ${currentFilter === 'premium' ? 'active' : ''}" onclick="setFilter('premium')">Premium</div>
                    <div class="filter-chip ${currentFilter === 'economy' ? 'active' : ''}" onclick="setFilter('economy')">Economy</div>
                    <div class="filter-chip ${currentFilter === 'sleeper' ? 'active' : ''}" onclick="setFilter('sleeper')">Sleeper</div>
                    <div class="filter-chip ${currentFilter === 'express' ? 'active' : ''}" onclick="setFilter('express')">Express</div>
                </div>
                
                <table class="bus-table">
                    <thead>
                        <tr><th>ID</th><th>Bus Name</th><th>Type</th><th>Route</th><th>Time</th><th>Fare</th><th>Seats</th><th>Rating</th><th>Action</th></tr>
                    </thead>
                    <tbody id="busesTableBody"></tbody>
                </table>
            </div>
        `;
        
        let filtered = buses;
        if(currentFilter !== 'all') {
            filtered = buses.filter(bus => bus.type.toLowerCase() === currentFilter.toLowerCase());
        }
        
        const tbody = document.getElementById('busesTableBody');
        tbody.innerHTML = filtered.map(bus => `
            <tr>
                <td>${bus.id}</td>
                <td><strong>🚌 ${bus.name}</strong></td>
                <td><span style="background:#00CEC9; padding:4px 8px; border-radius:20px; color:white;">${bus.type}</span></td>
                <td>${bus.from} → ${bus.to}</td>
                <td>${bus.time}</td>
                <td><strong>$${bus.fare}</strong></td>
                <td>${bus.seats - bus.bookedSeats.length}/${bus.seats}</td>
                <td>${bus.rating}</td>
                <td><button class="btn btn-primary" onclick="openBookingModal(${bus.id})" style="padding:5px 10px;">Book</button></td>
            </tr>
        `).join('');
    }

    function setFilter(filter) {
        currentFilter = filter;
        showBusesList();
    }

    // ==================== BOOKING MODAL ====================
    function openBookingModal(busId) {
        selectedBus = buses.find(b => b.id === busId);
        selectedSeats = [];
        
        const modalHtml = `
            <div id="bookingModal" class="modal" style="display:flex">
                <div class="modal-content">
                    <h2>Select Seats - ${selectedBus.name}</h2>
                    <p>${selectedBus.from} → ${selectedBus.to} | Fare: $${selectedBus.fare}</p>
                    <div class="seat-layout" id="seatGrid"></div>
                    <div style="margin:15px 0; padding:10px; background:#F0F3F4; border-radius:8px;">
                        <p><strong>Selected Seats:</strong> <span id="selectedSeatsList">None</span></p>
                        <p><strong>Total Fare:</strong> $<span id="totalFare">0</span></p>
                    </div>
                    <button class="btn btn-success" onclick="proceedToPayment()" style="width:100%; margin-bottom:10px;">Proceed to Payment</button>
                    <button class="btn btn-danger" onclick="closeModal()" style="width:100%;">Cancel</button>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const seatGrid = document.getElementById('seatGrid');
        for(let i = 1; i <= selectedBus.seats; i++) {
            const seat = document.createElement('div');
            seat.className = 'seat';
            if(selectedBus.bookedSeats.includes(i)) {
                seat.classList.add('booked');
                seat.innerHTML = `❌ ${i}`;
            } else {
                seat.classList.add('available');
                seat.innerHTML = i;
                seat.onclick = () => toggleSeat(i, seat);
            }
            seatGrid.appendChild(seat);
        }
    }

    function toggleSeat(seatNo, element) {
        if(element.classList.contains('booked')) return;
        
        if(selectedSeats.includes(seatNo)) {
            selectedSeats = selectedSeats.filter(s => s !== seatNo);
            element.classList.remove('selected');
            element.classList.add('available');
        } else {
            if(selectedSeats.length >= 6) {
                alert('Maximum 6 seats per booking!');
                return;
            }
            selectedSeats.push(seatNo);
            element.classList.remove('available');
            element.classList.add('selected');
        }
        
        document.getElementById('selectedSeatsList').innerText = selectedSeats.length ? selectedSeats.join(', ') : 'None';
        document.getElementById('totalFare').innerText = selectedSeats.length * selectedBus.fare;
    }

    function proceedToPayment() {
        if(selectedSeats.length === 0) {
            alert('Please select at least one seat!');
            return;
        }
        
        const total = selectedSeats.length * selectedBus.fare;
        
        const modalHtml = `
            <div id="paymentModal" class="modal" style="display:flex">
                <div class="modal-content">
                    <h2>💳 Payment Details</h2>
                    <div class="ticket">
                        <h3>Booking Summary</h3>
                        <p><strong>Bus:</strong> ${selectedBus.name}</p>
                        <p><strong>Route:</strong> ${selectedBus.from} → ${selectedBus.to}</p>
                        <p><strong>Seats:</strong> ${selectedSeats.join(', ')}</p>
                        <p><strong>Total:</strong> $${total}</p>
                    </div>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                    </div>
                    <button class="btn btn-success" onclick="confirmBooking()" style="width:100%;">Pay $${total}</button>
                    <button class="btn btn-danger" onclick="closeModal()" style="width:100%; margin-top:10px;">Cancel</button>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function confirmBooking() {
        const cardNumber = document.getElementById('cardNumber')?.value;
        if(!cardNumber || cardNumber.length < 8) {
            alert('Please enter valid card details!');
            return;
        }
        
        const booking = {
            id: 'BKG' + Date.now(),
            busName: selectedBus.name,
            from: selectedBus.from,
            to: selectedBus.to,
            date: new Date().toLocaleDateString(),
            time: selectedBus.time,
            seats: [...selectedSeats],
            total: selectedSeats.length * selectedBus.fare,
            passenger: currentUser.name,
            status: 'Confirmed'
        };
        
        bookings.push(booking);
        localStorage.setItem('balanced_bookings', JSON.stringify(bookings));
        selectedBus.bookedSeats.push(...selectedSeats);
        
        alert('✅ Payment Successful! Booking Confirmed.');
        closeModal();
        showPage('bookings');
    }

    // ==================== MY BOOKINGS ====================
    function showBookings() {
        const container = document.getElementById('mainContent');
        
        if(bookings.length === 0) {
            container.innerHTML = `
                <div class="card" style="text-align:center;">
                    <h2>🎫 My Bookings</h2>
                    <p style="padding:40px;">No bookings yet. Book a bus now!</p>
                    <button class="btn btn-primary" onclick="showPage('home')">Book Now</button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div>📋 Total Bookings</div><div class="stat-number">${bookings.length}</div></div>
                <div class="stat-card"><div>💰 Total Spent</div><div class="stat-number">$${bookings.reduce((s,b)=>s+b.total,0)}</div></div>
            </div>
            <div class="card">
                <h2>📋 My Booking History</h2>
                <div id="bookingsList"></div>
            </div>
        `;
        
        const bookingsDiv = document.getElementById('bookingsList');
        bookingsDiv.innerHTML = bookings.map((booking, index) => `
            <div class="bus-card" style="margin-bottom:15px;">
                <div class="bus-header">
                    <span class="bus-name">🚌 ${booking.busName}</span>
                    <span class="bus-fare">$${booking.total}</span>
                </div>
                <p>📍 ${booking.from} → ${booking.to}</p>
                <p>📅 ${booking.date} | ⏰ ${booking.time}</p>
                <p>💺 Seats: ${booking.seats.join(', ')}</p>
                <p>✅ ${booking.status}</p>
                <p>🆔 ID: ${booking.id}</p>
                <button class="btn btn-danger" onclick="cancelBooking(${index})" style="margin-top:15px;">Cancel Booking</button>
            </div>
        `).join('');
    }

    function cancelBooking(index) {
        if(confirm('Cancel this booking?')) {
            bookings.splice(index, 1);
            localStorage.setItem('balanced_bookings', JSON.stringify(bookings));
            showPage('bookings');
            alert('Booking cancelled!');
        }
    }

    // ==================== ADMIN PANEL ====================
    function showAdmin() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div>🚌 Total Buses</div><div class="stat-number">${buses.length}</div></div>
                <div class="stat-card"><div>🎫 Total Bookings</div><div class="stat-number">${bookings.length}</div></div>
                <div class="stat-card"><div>💰 Revenue</div><div class="stat-number">$${bookings.reduce((s,b)=>s+b.total,0)}</div></div>
            </div>
            
            <div class="card">
                <h2>➕ Add New Bus</h2>
                <div class="search-form">
                    <input type="text" id="newBusName" placeholder="Bus Name">
                    <input type="text" id="newBusFrom" placeholder="From City">
                    <input type="text" id="newBusTo" placeholder="To City">
                    <input type="time" id="newBusTime">
                    <input type="number" id="newBusFare" placeholder="Fare">
                    <input type="number" id="newBusSeats" placeholder="Total Seats">
                    <button onclick="addBus()">Add Bus</button>
                </div>
            </div>
            
            <div class="card">
                <h2>📋 Manage Buses</h2>
                <div id="adminBusesList"></div>
            </div>
        `;
        
        const adminDiv = document.getElementById('adminBusesList');
        adminDiv.innerHTML = buses.map((bus, index) => `
            <div class="bus-card" style="margin-bottom:10px;">
                <div class="bus-header">
                    <span class="bus-name">🚌 ${bus.name}</span>
                    <span class="bus-fare">$${bus.fare}</span>
                </div>
                <p>${bus.from} → ${bus.to} | ${bus.time}</p>
                <p>Seats: ${bus.seats - bus.bookedSeats.length}/${bus.seats}</p>
                <button class="btn btn-danger" onclick="deleteBus(${index})" style="margin-top:10px;">Delete Bus</button>
            </div>
        `).join('');
    }

    function addBus() {
        const name = document.getElementById('newBusName').value;
        const from = document.getElementById('newBusFrom').value;
        const to = document.getElementById('newBusTo').value;
        const time = document.getElementById('newBusTime').value;
        const fare = parseInt(document.getElementById('newBusFare').value);
        const seats = parseInt(document.getElementById('newBusSeats').value);
        
        if(!name || !from || !to || !time || !fare || !seats) {
            alert('Please fill all fields!');
            return;
        }
        
        const newBus = {
            id: buses.length + 1,
            name: name,
            type: "Standard",
            from: from,
            to: to,
            time: time,
            duration: "4h 30m",
            fare: fare,
            seats: seats,
            bookedSeats: [],
            amenities: "AC, WiFi",
            rating: "★★★★☆"
        };
        
        buses.push(newBus);
        alert('Bus added successfully!');
        showAdmin();
    }

    function deleteBus(index) {
        if(confirm('Delete this bus?')) {
            buses.splice(index, 1);
            showAdmin();
            alert('Bus deleted!');
        }
    }

    // ==================== PROFILE PAGE ====================
    function showProfile() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <div class="card">
                <h2>👤 User Profile</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profileName" value="${currentUser.name}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" value="${currentUser.email}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="profilePhone" value="${currentUser.phone}">
                </div>
                <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
            </div>
            <div class="card">
                <h2>📊 My Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div>Total Bookings</div><div class="stat-number">${bookings.length}</div></div>
                    <div class="stat-card"><div>Total Spent</div><div class="stat-number">$${bookings.reduce((s,b)=>s+b.total,0)}</div></div>
                </div>
            </div>
        `;
    }

    function updateProfile() {
        currentUser.name = document.getElementById('profileName').value;
        currentUser.email = document.getElementById('profileEmail').value;
        currentUser.phone = document.getElementById('profilePhone').value;
        localStorage.setItem('balanced_user', JSON.stringify(currentUser));
        alert('Profile updated!');
    }

    // ==================== UTILITIES ====================
    function closeModal() {
        document.querySelectorAll('.modal').forEach(modal => modal.remove());
    }

    // Initialize
    showPage('home');
</script>
</body>
</html>
